<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Comparação de duas retas pelos mínimos quadrados</title>
  <desc id="desc">Pontos reais de horas estudadas e notas, uma reta candidata e a reta com menor soma de erros quadrados.</desc>
  <rect width="720" height="420" fill="white"/>
  <text x="360" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Mínimos quadrados</text>
  <line x1="80" y1="330" x2="650" y2="330" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="330" x2="80" y2="55" stroke="#333" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="13" fill="#333">
    <text x="365" y="380" text-anchor="middle">Horas estudadas (x)</text>
    <text x="22" y="195" text-anchor="middle" transform="rotate(-90 22 195)">Nota (y)</text>
    <text x="76" y="348" text-anchor="end">0</text><text x="160" y="348">1</text><text x="240" y="348">2</text><text x="320" y="348">3</text><text x="400" y="348">4</text><text x="480" y="348">5</text><text x="560" y="348">6</text><text x="640" y="348">7</text>
    <text x="68" y="334" text-anchor="end">0</text><text x="68" y="289" text-anchor="end">1</text><text x="68" y="244" text-anchor="end">2</text><text x="68" y="199" text-anchor="end">3</text><text x="68" y="154" text-anchor="end">4</text><text x="68" y="109" text-anchor="end">5</text><text x="68" y="64" text-anchor="end">6</text>
  </g>
  <g stroke="#ddd" stroke-width="1">
    <line x1="160" y1="330" x2="160" y2="55"/><line x1="240" y1="330" x2="240" y2="55"/><line x1="320" y1="330" x2="320" y2="55"/><line x1="400" y1="330" x2="400" y2="55"/><line x1="480" y1="330" x2="480" y2="55"/><line x1="560" y1="330" x2="560" y2="55"/>
    <line x1="80" y1="285" x2="650" y2="285"/><line x1="80" y1="240" x2="650" y2="240"/><line x1="80" y1="195" x2="650" y2="195"/><line x1="80" y1="150" x2="650" y2="150"/><line x1="80" y1="105" x2="650" y2="105"/>
  </g>
  <line x1="80" y1="285" x2="364" y2="56" stroke="#d9534f" stroke-width="3" stroke-dasharray="9 7"/>
  <line x1="80" y1="315" x2="362" y2="60" stroke="#2367c9" stroke-width="4"/>
  <g fill="#111"><circle cx="160" cy="240" r="6"/><circle cx="240" cy="195" r="6"/><circle cx="320" cy="105" r="6"/></g>
  <g font-family="Arial, sans-serif" font-size="13">
    <line x1="420" y1="78" x2="455" y2="78" stroke="#2367c9" stroke-width="4"/><text x="465" y="83" fill="#333">reta de menor SSE</text>
    <line x1="420" y1="102" x2="455" y2="102" stroke="#d9534f" stroke-width="3" stroke-dasharray="9 7"/><text x="465" y="107" fill="#333">reta candidata</text>
    <circle cx="437" cy="128" r="6" fill="#111"/><text x="465" y="133" fill="#333">dados observados</text>
  </g>
</svg>
